// Teleop operator message definition.
//
// This is the ONLY proto for the teleop topic. action.proto and
// observation.proto remain untouched (vendored from the monorepo as-is).
// teleop.proto imports observation.proto for shared types (Pose7D,
// EndEffectorPoses, EndEffectorStates) but does not modify them.
//
// Frame types carried on {project_id}/{device_id}/teleop/actions:
//   - command frames: oneof command set, no pose data     (RELIABLE)
//   - action frames:  end_effector_poses + end_effector_states (BEST_EFFORT)
//
// Grip gating is done at the operator: if a hand's grip is not pressed,
// that hand's pose and trigger are simply NOT included in the message.
// No SafetyMeta is needed — the absence of data IS the safety signal.

syntax = "proto3";

package r2c_sdk;

import "common.proto";

option csharp_namespace = "R2c.Sdk";

// Teleop operator frame (both command and action).
message TeleopFrame {
  // Timestamp (ms epoch), same convention as other r2c messages.
  int64 timestamp = 1;

  // Operator identity.
  string operator_id = 2;

  // Input mode of the session, set together with the start command (and
  // carried on later frames too). Was TeleopStart.input_mode; promoted to
  // the frame level so all lifecycle commands are empty messages.
  InputMode input_mode = 3;

  // Session ID (set on start, empty otherwise).
  string session_id = 4;

  // Session lifecycle command. Only present on control frames;
  // action frames leave this unset.
  oneof command {
    TeleopStart start = 5;
    TeleopPause pause = 6;
    TeleopResume resume = 7;
    TeleopFinish finish = 8;
    TeleopQuit quit = 9;
  }

  // Joint states. Mirrors action.proto's JointAction with the chunk-level
  // repeated removed (a teleop frame carries exactly one chunk): names plus
  // a single step per channel, where the step itself still holds one value
  // per joint.
  TeleopJointStates joint_states = 10;

  // Per-hand absolute poses. action.proto's map<string,
  // EndEffectorPoseChunk> shape with the chunk-level repeated removed: one
  // TeleopEndEffectorPose per hand (key = hand name).
  TeleopEndEffectorPoses end_effector_poses = 11;

  // Per-hand trigger values (action.proto's EndEffectorStateAction with the
  // chunk-level repeated removed; the step's data carries one trigger per
  // hand).
  TeleopEndEffectorStates end_effector_states = 12;

  // Raw headset control inputs (A/X, thumbstick button, thumbstick axes),
  // attached to action frames as a passthrough for downstream logic.
  // The gateway makes NO session decisions from these.
  // Grouped per hand/control (following observation.proto's extension
  // mechanism):
  //   <hand>.btn.primary     bool   primary/manipulator button — not limited
  //                                 to VR controllers; a master/slave arm
  //                                 button may publish it too
  //   <hand>.btn.thumbstick  bool   thumbstick press
  //   <hand>.stick.x/y       float  thumbstick axis, -1..1
  // where <hand> is "left" or "right".
  map<string, ExtensionValue> extensions = 13;
}

// Start carries no payload of its own: the input mode lives on the frame
// (TeleopFrame.input_mode), so all lifecycle commands are empty messages.
message TeleopStart {}

// Empty payloads; presence in oneof selects the transition.
message TeleopPause {}
message TeleopResume {}
message TeleopFinish {}
message TeleopQuit {}

// One time step of per-element values (action.proto's JointStateStep shape).
// In teleop frames this is a single step (one chunk per frame), so it is not
// repeated: `data` holds one value per joint / end effector.
message TeleopStep {
  repeated double data = 1;
}

// action.proto's JointAction with the chunk-level repeated removed.
message TeleopJointStates {
  // Joint names (length = N_joints).
  repeated string names = 1;
  // One step per channel; data length = N_joints.
  TeleopStep position = 2;
  TeleopStep velocity = 3;
  TeleopStep torque = 4;
}

// action.proto's map<string, EndEffectorPoseChunk> shape with one pose per
// hand (no chunk dimension; the repeated is removed).
message TeleopEndEffectorPoses {
  // Key: hand/effector name (e.g. "left", "right").
  map<string, TeleopEndEffectorPose> pose = 1;
}

// One end effector pose (action.proto's EndEffectorPoseChunk without the
// repeated chunk list).
message TeleopEndEffectorPose {
  Pose7D pose = 1;
}

// action.proto's EndEffectorStateAction with the chunk-level repeated
// removed.
message TeleopEndEffectorStates {
  // Effector names (length = N_effectors).
  repeated string names = 1;
  // One step per channel; data length = N_effectors (e.g. trigger 0..1).
  TeleopStep position = 2;
  TeleopStep velocity = 3;
  TeleopStep torque = 4;
}

enum InputMode {
  INPUT_MODE_UNSPECIFIED = 0;
  INPUT_MODE_VR = 1;
  INPUT_MODE_ISOMORPHIC = 2;
}
