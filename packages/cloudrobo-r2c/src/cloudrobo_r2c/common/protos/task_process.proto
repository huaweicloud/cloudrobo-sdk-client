syntax = "proto3";

package r2c_sdk;

option java_package = "com.huawei.cloudrobo.r2csdk.proto";
option java_outer_classname = "TaskProcessProto";
option java_multiple_files = false;

message TaskProcess {

  // 数据来源标识，发布时由 _ensure_state_source 填充 "{project_id}/{device_id}"
  string source = 1;

  // 作业id
  string session_id = 2;

  // 作业名称
  string session_name = 3;

  // 此任务节点的开始时间
  int64 timestamp = 4;

  //当前作业编排的所有任务节点信息
  repeated TaskNode nodes = 5;

  // 当前节点的step
  TaskStep current_step = 6;
}

message TaskNode {
  
  // 任务节点id
  string task_id = 1;

  // 任务节点名称
  string task_name = 2;
  
  // 任务进度
  float progress = 3;

  // 任务节点执行结果状态
  int32 result_state = 4;

  // 此任务节点重试次数
  int32 retry_count = 5;

  // 此任务节点开始时间
  int64 start_timestamp = 6;

  // 此任务节点耗时
  int64 duration = 7;
}

message TaskStep {

  int64 action_timestamp = 1;

  // 任务节点id
  string task_id = 2;

  string action_str = 3;

  int64 action_duration = 4;

  int64 think_timestamp = 5;

  int64 think_duration = 6;

}
