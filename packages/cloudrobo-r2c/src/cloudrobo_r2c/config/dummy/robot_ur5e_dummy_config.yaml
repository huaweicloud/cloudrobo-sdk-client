# =============================================================================
# R2C Device Configuration — UR5e Dummy (仿真模拟)
#
# 描述: 使用 DummyRobotHardwareAdapter 模拟 UR5e 机械臂 + 夹爪 + 双相机，
#       便于本地快速联调 cloudroboclient ↔ policy server 的完整链路。
#
# 用法:
#   python -m r2c_sdk.cloudroboclient \
#     --client-config config/client_config.yaml \
#     --robot-config config/dummy/robot_ur5e_dummy_config.yaml
#
# 联调 (配合 policy server):
#   终端 1: python -m r2c_sdk.inference.r2c_lerobot_policy_server \
#             --client-config config/client_config.yaml \
#             --cloud-config config/cloud_ur5e_act.yaml \
#             --policy-type act --device cpu
#   终端 2: python -m r2c_sdk.cloudroboclient \
#             --client-config config/client_config.yaml \
#             --robot-config config/dummy/robot_ur5e_dummy_config.yaml
# =============================================================================

schema_version: "v2.1"

# =============================================================================
# 运行时配置
# =============================================================================
runtime:
  # 动作执行频率 (Hz)，同时决定观测发布检查频率。建议 10–30 Hz
  publish_hz: 20.0
  # 最大运行时长 (秒)，0 表示一直运行，Ctrl+C 停止
  max_duration_s: 0.0
  # dry_run=true 时不执行推理出来的 action，但正常发送观测数据。适用于不需要机器人真正运动，但需要发送真实观测数据的调试场景
  dry_run: false
  # 发布观测后等待 action 的超时 (秒)，超时后重新发布观测。弱网 / 大模型场景建议 ≥ 30 s
  action_response_timeout_s: 30.0
  # 每次 chunk 最多入队的 action 步数，多余的丢弃。-1 表示全部采用
  max_enqueue_actions_per_chunk: -1
  # 是否启用 action chunk 对齐（避免轨迹跳跃）
  enable_action_chunk_alignment: true
  # 启动时跳过的 observation 数量（让动作队列预先填满后再开始执行）
  skip_initial_observations: 1

  # ── 异步请求融合配置 ─────────────────────────────────────────────
  async_request:
    enabled: false

    publish_trigger_threshold: 0

    fusion:
      strategy: replace
      window_size: 10
      # state_types:  # 示例 (按实际 DOF 修改):
      #   - joint_angle
      #   - joint_angle
      # state_type_order:
      #   euler: rpy
      #   quaternion: wxyz
  # ── end async_request ─────────────────────────────────────────────

  # 键盘控制：空格 = 暂停/恢复，h = 回 home (暂停时)，e = 优雅退出
  keyboard_control:
    enabled: true
    # keymap:  # 自定义按键映射 (可选)

hardware:
  type: "dummy"
  config:
    # UR5e 6 关节 + 夹爪 → 7 维状态向量 (与 ACT 模型对齐)
    joint_names:
        - x
        - y
        - z
        - rx
        - ry
        - rz
        - gripper_position

    # 初始关节位置 (UR5e 典型 home 位姿 + 夹爪半开)
    initial_joint_positions: [0.0, -1.57, -1.57, -1.57, 1.57, 0.0, 0.04]
    max_joint_speed_rad_s: 1.5

    # 双相机: 与真实 UR5e 配置和 ACT 模型 input_features 对齐
    image_specs:
      wrist:
        h: 480
        w: 640
        c: 3
      third_person:
        h: 480
        w: 640
        c: 3


# =============================================================================
# 设备翻译器
# =============================================================================
translator:
  type: "configurable"

# =============================================================================
# 上行: Dummy 设备数据 → R2C Observations
#
# 产出与 robot_ur5e_config.yaml 一致的 observation 结构，
# 确保 cloud_ur5e_act.yaml 的 r2c_to_model 映射能正确消费。
# =============================================================================
device_to_r2c:
  task: "ur5e dummy teleop"
  mappings:
    # 关节名 (与 ACT 模型无关，但保留用于调试)
    - target_key: "joint_states.names"
      default:
        - x
        - y
        - z
        - rx
        - ry
        - rz
        - gripper_position

    # 状态向量 7 维 (6 关节 + 1 夹爪) — 与 ACT 模型 observation.state 对齐
    - target_key: "joint_states.position"
      source_paths:
        - "x"
        - "y"
        - "z"
        - "rx"
        - "ry"
        - "rz"
        - "gripper_position"

    # 腕部相机 → JPEG 压缩
    - target_key: "images.color.wrist"
      source_path: "wrist"
      transforms: ndarray_to_jpeg
      required: false

    # 第三人称相机 → JPEG 压缩
    - target_key: "images.color.third_person"
      source_path: "third_person"
      transforms: ndarray_to_jpeg
      required: false

# =============================================================================
# 下行: R2C Actions → Dummy 设备指令
#
# 将 joint_states.position (7 维数组) 按索引拆分到各关节 target。
# =============================================================================
r2c_to_device:
  mappings:
    - target: "x"
      source: "joint_states.position"
      source_index: 0
      use_assign_dotted: false
      required: true

    - target: "y"
      source: "joint_states.position"
      source_index: 1
      use_assign_dotted: false
      required: true

    - target: "z"
      source: "joint_states.position"
      source_index: 2
      use_assign_dotted: false
      required: true

    - target: "rx"
      source: "joint_states.position"
      source_index: 3
      use_assign_dotted: false
      required: true

    - target: "ry"
      source: "joint_states.position"
      source_index: 4
      use_assign_dotted: false
      required: true

    - target: "rz"
      source: "joint_states.position"
      source_index: 5
      use_assign_dotted: false
      required: true

    - target: "gripper_position"
      source: "joint_states.position"
      source_index: 6
      use_assign_dotted: false
      required: true
