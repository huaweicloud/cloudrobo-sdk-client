                "wrench_raw-10_0", "wrench_raw-10_1", "wrench_raw-10_2", "wrench_raw-10_3", "wrench_raw-10_4", "wrench_raw-10_5"]

    # 关节位置 (101个字段)
    - target_key: "joint_states.position"
      source_paths: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6",
