                     "wrench_raw-7_0", "wrench_raw-7_1", "wrench_raw-7_2", "wrench_raw-7_3", "wrench_raw-7_4", "wrench_raw-7_5",
                     "wrench_raw-8_0", "wrench_raw-8_1", "wrench_raw-8_2", "wrench_raw-8_3", "wrench_raw-8_4", "wrench_raw-8_5",
