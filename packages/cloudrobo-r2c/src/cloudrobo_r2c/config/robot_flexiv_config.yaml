    - target_key: "joint_states.names"
      default: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6",
                "dq_1", "dq_2", "dq_3", "dq_4", "dq_5", "dq_6",
                "tau_1", "tau_2", "tau_3", "tau_4", "tau_5", "tau_6",
                "tcp_x", "tcp_y", "tcp_z",
                "tcp_qw", "tcp_qx", "tcp_qy", "tcp_qz",
                "tcp_roll", "tcp_pitch", "tcp_yaw",
                "wrench_raw_0", "wrench_raw_1", "wrench_raw_2", "wrench_raw_3", "wrench_raw_4", "wrench_raw_5",
                "wrench_filtered_0", "wrench_filtered_1", "wrench_filtered_2", "wrench_filtered_3", "wrench_filtered_4", "wrench_filtered_5",
