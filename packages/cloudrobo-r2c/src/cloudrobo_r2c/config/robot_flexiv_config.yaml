schema_version: "v2.1"

runtime:
  # 动作执行频率 (Hz)，同时决定观测发布检查频率。建议 10–30 Hz
  publish_hz: 5
  # 最大运行时长 (秒)，0 表示一直运行，Ctrl+C 停止
  max_duration_s: 0.0
  # dry_run=true 时不执行推理出来的 action，但正常发送观测数据。适用于不需要机器人真正运动，但需要发送真实观测数据的调试场景
  dry_run: false
  # 发布观测后等待 action 的超时 (秒)，超时后重新发布观测。弱网 / 大模型场景建议 ≥ 30 s
  action_response_timeout_s: 30.0
  # 每次 chunk 最多入队的 action 步数，多余的丢弃。-1 表示全部采用
  max_enqueue_actions_per_chunk: -1
  # 是否启用 action chunk 对齐（避免轨迹跳跃）
  enable_action_chunk_alignment: false
  # 启动时跳过的 observation 数量（让动作队列预先填满后再开始执行）
  skip_initial_observations: 1

  # ── 异步请求融合配置 ─────────────────────────────────────────────
  async_request:
    enabled: false

    publish_trigger_threshold: 0

    fusion:
      strategy: replace
      window_size: 10
      # state_types:  # 示例 (按实际 DOF 修改):
      #   - joint_angle
      #   - joint_angle
      # state_type_order:
      #   euler: rpy
      #   quaternion: wxyz
  # ── end async_request ─────────────────────────────────────────────
  # 键盘控制：空格 = 暂停/恢复，h = 回 home (暂停时)，e = 优雅退出
  keyboard_control:
    enabled: true
    # keymap:  # 自定义按键映射 (可选)

hardware:
  type: "flexiv"
  config:
    # Flexiv 机器人序列号
    robot_sn: "Rizon4-062833"

    # dry_run: true

    # 夹爪配置（从配置读取，不硬编码）
    gripper_name: "Flexiv-GN01"
    gripper_open_width: 0.09    # 夹爪完全打开宽度 (m)
    gripper_close_width: 0.012  # 夹爪完全闭合宽度 (m)
    gripper_velocity: 0.10
    gripper_force_limit: 20.0

    # 力传感器
    zero_ft_on_start: false
    force_limit_n: 20.0

    # 力矩历史配置
    force_history_len: 10    # 保留的历史帧数
    force_history_freq: 30   # 力矩采样频率 (Hz)

    # 摄像头配置
    cameras:
      wrist:
        source: 6
        width: 640
        height: 480
        fps: 30
      third:
        source: 14
        width: 640
        height: 480
        fps: 30

    # 命令配置
    #commands:
    #  go_home:
    #    type: go_home
    #    pose_euler: [0.5, 0.0, 0.3, 0.0, 3.14, 0.0]  # [x, y, z, roll, pitch, yaw]
    #    gripper: 0.02    # 可选,夹爪目标宽度(m)

translator:
  type: "configurable"

