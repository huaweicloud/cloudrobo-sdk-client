schema_version: "v2.1"

runtime:
  # 动作执行频率 (Hz)，同时决定观测发布检查频率。建议 10–30 Hz
  publish_hz: 10.0
  # 最大运行时长 (秒)，0 表示一直运行，Ctrl+C 停止
  max_duration_s: 0.0
  # dry_run=true 时不执行推理出来的 action，但正常发送观测数据。适用于不需要机器人真正运动，但需要发送真实观测数据的调试场景
  dry_run: false
  # 发布观测后等待 action 的超时 (秒)，超时后重新发布观测。弱网 / 大模型场景建议 ≥ 30 s
  action_response_timeout_s: 30.0
  # 每次 chunk 最多入队的 action 步数，多余的丢弃。-1 表示全部采用
  max_enqueue_actions_per_chunk: -1
  # 是否启用 action chunk 对齐（避免轨迹跳跃）
  enable_action_chunk_alignment: false
  # 启动时跳过的 observation 数量（让动作队列预先填满后再开始执行）
  skip_initial_observations: 1

  # ── 异步请求融合配置 ─────────────────────────────────────────────
  async_request:
    enabled: false

    publish_trigger_threshold: 0

    fusion:
      strategy: replace
      window_size: 10
      # state_types:  # 示例 (按实际 DOF 修改):
      #   - joint_angle
      #   - joint_angle
      # state_type_order:
      #   euler: rpy
      #   quaternion: wxyz
  # ── end async_request ─────────────────────────────────────────────

  # 键盘控制：空格 = 暂停/恢复，h = 回 home (暂停时)，e = 优雅退出
  keyboard_control:
    enabled: true
    # keymap:  # 自定义按键映射 (可选)

hardware:
  # 当前激活的硬件适配器类型。支持: "lerobot", "ros2", "raw_sdk"
  type: "ros2"
  config:
    node_name: "r2c_so101_simulation"
    spin_timeout_sec: 0.05
    auto_spin: True
    subscriptions:
      joint_states:
        topic: /joint_states
        msg_type: sensor_msgs.msg.JointState
        qos: 10
        max_update_hz: 10
        store_as: joint_states
        include_fields: ["name", "position", "velocity", "effort"]
        field_aliases:
          name: names
      front:
        topic: /camera_front/camera_image_color
        msg_type: sensor_msgs.msg.Image
        qos: 10
        store_as: front
        store_raw_message: true
      wrist:
        topic: /camera_wrist/camera_image_color
        msg_type: sensor_msgs.msg.Image
        qos: 10
        store_as: wrist
        store_raw_message: true
    command_publishers:
      arm:
        topic: "/arm_position_controller/commands"
        msg_type: std_msgs.msg.Float64MultiArray
        qos: 10
      gripper:
        topic: "/hand_position_controller/commands"
        msg_type: std_msgs.msg.Float64MultiArray
        qos: 10
    default_command_publisher: arm
    action_targets:
      arm: arm
      gripper: gripper

translator:
  type: "configurable"

device_to_r2c:
  task: pick and place task
  mappings:
    # 关节名称映射 (使用模型标准名称)
    - target_key: "joint_states.names"
      default: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]

    # 关节位置数据 (从ROS joint_states订阅获取)
    - target_key: "joint_states.position"
      source: streams.joint_states.position
      transforms: array_to_list

    # 前相机图像 (ROS Image -> JPEG)
    - target_key: "images.color.front"
      source_path: "streams.front"
      transforms: ros_image_to_jpeg

    # 腕部相机图像 (ROS Image -> JPEG)
    - target_key: "images.color.wrist"
      source_path: "streams.wrist"
      transforms: ros_image_to_jpeg

r2c_to_device:
  mappings:
    # 手臂关节控制 - 分离映射每个关节到对应的ROS topic
    - target: "shoulder_pan.pos"
      source: "joint_states.position"
      source_index: 0
      use_assign_dotted: false
      required: true

    - target: "shoulder_lift.pos"
      source: "joint_states.position"
      source_index: 1
      use_assign_dotted: false
      required: true

    - target: "elbow_flex.pos"
      source: "joint_states.position"
      source_index: 2
      use_assign_dotted: false
      required: true

    - target: "wrist_flex.pos"
      source: "joint_states.position"
      source_index: 3
      use_assign_dotted: false
      required: true

    - target: "wrist_roll.pos"
      source: "joint_states.position"
      source_index: 4
      use_assign_dotted: false
      required: true

    # 夹爪控制 - 使用自定义转换器将模型值转换为实际关节值
    - target: "gripper.pos"
      source: "joint_states.position"
      source_index: 5
      use_assign_dotted: false
      required: true
      transforms:
        - so101_gripper_value_to_joint

r2c_to_model:
  mappings:
    - source_path: "images.color.front"
      target_key: "observation.images.front"
      transforms:
        - jpeg_to_ndarray
        - rgb_to_bgr
      required: true

    - source_path: "images.color.wrist"
      target_key: "observation.images.wrist"
      transforms:
        - jpeg_to_ndarray
        - rgb_to_bgr
      required: true

    - source_path: "joint_states.position"
      target_key: "observation.state"
      slice_start: 0
      slice_end: 6
      required: true

    - source_path: "task"
      target_key: "task"
      required: false

model_to_r2c:
  mappings:
    - source_tensor: "action"
      target_key: "joint_states.position"
      slice_start: 0
      slice_end: 6
