# A1Z + G1Z 夹爪 机器人配置文件
# 使用方式: python -m r2c_sdk.cloudroboclient --robot-config config/robot_a1z_config.yaml

schema_version: "v2.1"

runtime:
  # 观测发布与动作执行频率 (Hz)
  publish_hz: 30.0
  # 最大运行时长 (秒)，0 表示一直运行，Ctrl+C 停止
  max_duration_s: 0.0
  # dry_run=true 时不执行推理出来的 action，但正常发送观测数据
  dry_run: false
  # 发布观测后等待 action 的超时 (秒)
  action_response_timeout_s: 5.0
  # 每次 chunk 最多入队的 action 步数，-1 表示全部采用
  max_enqueue_actions_per_chunk: 25
  # 是否启用 action chunk 对齐（避免轨迹跳跃）
  enable_action_chunk_alignment: false
  # 启动时跳过的 observation 数量（让动作队列预先填满后再开始执行）
  skip_initial_observations: 1

  # ── 异步请求融合配置 ─────────────────────────────────────────────
  async_request:
    enabled: false
    publish_trigger_threshold: 10
    fusion:
      strategy: nearest_neighbor
      window_size: 10
      state_types:
        - joint_angle
        - joint_angle
        - joint_angle
        - joint_angle
        - joint_angle
        - joint_angle
  # ── end async_request ─────────────────────────────────────────────

  # 心跳自动上报
  heartbeat:
    enabled: true
    interval_ms: 1000
    jitter_ms: 0
    status: "ONLINE"
    mode: "AUTO"

  # 键盘控制：空格 = 暂停/恢复，h = 回 home (暂停时)，e = 优雅退出
  keyboard_control:
    enabled: true
    keymap:
      "e": emergency_stop
      "r": estop_release
      "h": go_home
      "j": go_home_1

# ── 硬件适配器配置 ───────────────────────────────────────────────────
hardware:
  type: "a1z"
  config:
    # CAN 通道名 (默认 can0)
    can_channel: "can0"

    # 控制回路频率 (Hz)，默认 250
    control_freq_hz: 250

    # 夹爪最大夹持力矩 (Nm)，默认 2.0
    gripper_max_torque: 2.0

    # 夹爪宽度映射 — 物理宽度与归一化 [0, 1] 的对应关系
    # 默认 open=1.0, close=0.0 表示直接使用归一化值
    gripper_open_width: 1.0    # 张开对应的宽度值
    gripper_close_width: 0.0   # 闭合对应的宽度值

    # move_to 默认移动速度 (rad/s)
    move_speed: 0.5

    # 相机配置 — 每个相机作为一个独立的 capture thread (ADR-0006)
    # source 支持 /dev/videoN 索引 (如 0, 2) 或 /dev/v4l/by-id/ 稳定路径
    cameras:
      # 腕部相机 (示例，按实际接线修改 source)
      wrist:
        source: 5
        width: 640
        height: 480
        fps: 30
      # 头部/全局相机 (示例，按实际接线修改 source)
      front:
        source: 12
        width: 1280
        height: 720
        fps: 30

    # ── 命令配置 ─────────────────────────────────────────────────
    commands:
      # 回 Home 位 — A1Z SDK 默认 home: joints=[0°, 60°, -60°, 0°, 0°, 0°]
      go_home:
        type: go_home
        # 6 个关节角度 (rad): J1=0, J2≈1.047(60°), J3≈-1.047(-60°), J4=0, J5=0, J6=0
        joints: [-0.010109102353453636, 0.013160906732082367, -0.05970092490315437, 0.05436026677489281, 0.037193864583969116, -0.031090257689356804]
        # 可选: 回 home 后夹爪动作: "open" | "close" | 数值 (归一化 0~1)
        gripper: open

      go_home_1:
        type: go_home
        # 6 个关节角度 (rad): J1=0, J2≈1.047(60°), J3≈-1.047(-60°), J4=0, J5=0, J6=0
        joints: [-0.03452353551983833, 0.620851457118988, -0.770008385181427, 0.5376898050308228, -0.013923857361078262, 0.05436026677489281]
        # 可选: 回 home 后夹爪动作: "open" | "close" | 数值 (归一化 0~1)
        gripper: open

        

      # 急停 — 保留重力补偿, kp=0, 钉住当前位置
      emergency_stop:
        type: estop
        action: estop

      # 急停恢复 — 恢复正常 PD 控制
      estop_release:
        type: estop
        action: release

# ── 翻译器配置 ───────────────────────────────────────────────────────
translator:
  type: "configurable"

# ── 设备→R2C 观测映射 ────────────────────────────────────────────────
device_to_r2c:
  task: "A1Z arm teleoperation"
  image_encoding: jpeg
  mappings:
    # 关节 names — 6 轴 + 夹爪
    - target_key: "joint_states.names"
      default:
        - arm_joint1
        - arm_joint2
        - arm_joint3
        - arm_joint4
        - arm_joint5
        - arm_joint6
        - gripper

    # 关节位置 — 从 joint_positions (7D ndarray) 转为 list
    - target_key: "joint_states.position"
      source_path: "joint_positions"
      transforms: array_to_list

    # A1Z adapter 统一输出 BGR ndarray，由 ndarray_to_jpeg 编码
    - target_key: "images.color.wrist"
      source_path: "wrist"
      transforms: ndarray_to_jpeg

    - target_key: "images.color.front"
      source_path: "front"
      transforms: ndarray_to_jpeg

# ── R2C→设备 动作映射 ────────────────────────────────────────────────
r2c_to_device:
  mappings:
    # 将云端 joint_states.position 映射为 A1Z 适配器的 per-joint 目标
    # 格式: joint_states.position = [j1, j2, j3, j4, j5, j6, gripper] (7 元素, rad + 归一化)
    - target: "joint_0"
      source: "joint_states.position"
      source_index: 0
      required: true
    - target: "joint_1"
      source: "joint_states.position"
      source_index: 1
      required: true
    - target: "joint_2"
      source: "joint_states.position"
      source_index: 2
      required: true
    - target: "joint_3"
      source: "joint_states.position"
      source_index: 3
      required: true
    - target: "joint_4"
      source: "joint_states.position"
      source_index: 4
      required: true
    - target: "joint_5"
      source: "joint_states.position"
      source_index: 5
      required: true
    - target: "gripper"
      source: "joint_states.position"
      source_index: 6
      required: false
