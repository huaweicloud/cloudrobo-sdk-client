# =============================================================================
# R2C Edge Configuration — Playback (回放录制数据)
#
# 描述: 使用 PlaybackRobotAdapter 回放之前通过 --record 录制的观测数据。
#       适用于离线调试 cloudroboclient ↔ policy server 链路，无需真实硬件。
#
# 用法:
#   1. 先录制:
#      python -m r2c_sdk.cloudroboclient \
#        --robot-config config/robot_ur5e_config.yaml \
#        --record recordings/ur5e_demo.r2cr
#
#   2. 再回放:
#      python -m r2c_sdk.cloudroboclient \
#        --robot-config config/robot_playback_config.yaml
#
# 联调 (配合 policy server):
#   终端 1: python -m r2c_sdk.inference.r2c_lerobot_policy_server \
#             --client-config config/client_config.yaml \
#             --cloud-config config/cloud_ur5e_act.yaml \
#             --policy-type act --device cpu
#   终端 2: python -m r2c_sdk.cloudroboclient \
#             --client-config config/client_config.yaml \
#             --robot-config config/robot_playback_config.yaml
# =============================================================================

schema_version: "v2.1"
robot_id: "playback_001"
task_name: "ur5e_playback"

# =============================================================================
# 运行时配置
# =============================================================================
runtime:
  # 动作执行频率 (Hz)，同时决定观测发布检查频率。建议 10–30 Hz
  publish_hz: 30.0
  # 最大运行时长 (秒)，0 表示一直运行，Ctrl+C 停止
  max_duration_s: 0.0
  # dry_run=true 时不执行推理出来的 action，但正常发送观测数据。适用于不需要机器人真正运动，但需要发送真实观测数据的调试场景
  dry_run: false
  # 发布观测后等待 action 的超时 (秒)，超时后重新发布观测。弱网 / 大模型场景建议 ≥ 30 s
  action_response_timeout_s: 30.0
  # 每次 chunk 最多入队的 action 步数，多余的丢弃。-1 表示全部采用
  max_enqueue_actions_per_chunk: -1
  # 是否启用 action chunk 对齐（避免轨迹跳跃）
  enable_action_chunk_alignment: true
  # 启动时跳过的 observation 数量（让动作队列预先填满后再开始执行）
  skip_initial_observations: 1

  # ── 异步请求融合配置 ─────────────────────────────────────────────
  async_request:
    enabled: false

    publish_trigger_threshold: 0

    fusion:
      strategy: replace
      window_size: 10
      # state_types:  # 示例 (按实际 DOF 修改):
      #   - joint_angle
      #   - joint_angle
      # state_type_order:
      #   euler: rpy
      #   quaternion: wxyz
  # ── end async_request ─────────────────────────────────────────────

  # 键盘控制：空格 = 暂停/恢复，h = 回 home (暂停时)，e = 优雅退出
  keyboard_control:
    enabled: true
    # keymap:  # 自定义按键映射 (可选)

hardware:
  type: playback
  config:
    recording_file: "recordings/r1_0528_2.r2cr"
    loop: true            # 播完后循环回开头

# =============================================================================
# 设备翻译器: 与被录制的真实机器人使用相同的映射配置
# =============================================================================
translator:
  type: "configurable"

# =============================================================================
# 上行映射: 设备数据 → R2C Observations
#
# 与被录制的 robot_ur5e_config.yaml 的 device_to_r2c 保持一致。
# =============================================================================
device_to_r2c:
  task: "ros1 teleoperation"
  mappings:
    - target_key: "joint_states.names"
      default:
        - x
        - y
        - z
        - rx
        - ry
        - rz
        - gripper_position

    - target_key: "joint_states.position"
      source_path: "arm_left.position"

    - target_key: "joint_states.position"
      source_path: "gripper_left.position"
      source_index: 0
      target_index: 6

    - target_key: "images.color.wrist_left"
      source_path: "left_wrist"

    - target_key: "images.color.wrist_right"
      source_path: "right_wrist"

    - target_key: "images.color.front"
      source_path: "head"

# =============================================================================
# 下行映射: R2C Actions → 设备指令
#
# 示例: 模型输出 joint_states.position (7D):
#         [j1..j6, grip] → arm_left.position (6D) + gripper_left.position (1D)
# =============================================================================
r2c_to_device:
  mappings:
    - target: "arm_left.position"
      source: "joint_states.position"
      transforms:
        - slice:
            start: 0
            end: 6

    - target: "gripper_left.position"
      source: "joint_states.position"
      source_index: 6
