r1:
  ros_to_r2c:
    observations.joint_states.position:
      sub_topic_name: "/joint_states"
      msg_type: sensor_msgs.msg.JointState
      joint_names:
        - left_arm_joint1
        - left_arm_joint2
        - left_arm_joint3
        - left_arm_joint4
        - left_arm_joint5
        - left_arm_joint6
        - right_arm_joint1
        - right_arm_joint2
        - right_arm_joint3
        - right_arm_joint4
        - right_arm_joint5
        - right_arm_joint6
    observations.end_effector_states.position:
      sub_topic_name: "/joint_states"
      msg_type: sensor_msgs.msg.JointState
      joint_names:
        - left_gripper_finger_joint1
        - left_gripper_finger_joint2
        - right_gripper_finger_joint1
        - right_gripper_finger_joint2
    observations.images.color.front:
      sub_topic_name: "/camera_head_left/camera_image_color"
      msg_type: sensor_msgs.msg.Image
    observations.images.color.wrist_left:
      sub_topic_name: "/camera_left/camera_image_color"
      msg_type: sensor_msgs.msg.Image
    observations.images.color.wrist_right:
      sub_topic_name: "/camera_right/camera_image_color"
      msg_type: sensor_msgs.msg.Image
  r2c_to_ros:
    actions.joint_states.position:
      - pub_topic_name: "/left_arm_position_controller/commands"
        msg_type: std_msgs.msg.Float64MultiArray
        joint_names:
        - left_arm_joint1
        - left_arm_joint2
        - left_arm_joint3
        - left_arm_joint4
        - left_arm_joint5
        - left_arm_joint6
      - pub_topic_name: "/right_arm_position_controller/commands"
        msg_type: std_msgs.msg.Float64MultiArray
        joint_names:
        - right_arm_joint1
        - right_arm_joint2
        - right_arm_joint3
        - right_arm_joint4
        - right_arm_joint5
        - right_arm_joint6
    actions.end_effector_states.position:
      - pub_topic_name: "/left_gripper_position_controller/commands"
        msg_type: std_msgs.msg.Float64MultiArray
        joint_names:
        - left_gripper_finger_joint1
        - left_gripper_finger_joint2
      - pub_topic_name: "/right_gripper_position_controller/commands"
        msg_type: std_msgs.msg.Float64MultiArray
        joint_names:
        - right_gripper_finger_joint1
        - right_gripper_finger_joint2
  robot_to_model_joint_names_mapping:
    left_arm_joint1: left_arm_1
    left_arm_joint2: left_arm_2
    left_arm_joint3: left_arm_3
    left_arm_joint4: left_arm_4
    left_arm_joint5: left_arm_5
    left_arm_joint6: left_arm_6
    right_arm_joint1: right_arm_1
    right_arm_joint2: right_arm_2
    right_arm_joint3: right_arm_3
