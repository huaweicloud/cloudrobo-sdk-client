[build-system]
requires = ["setuptools==83.0.0", "packaging==26.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-cloudrobo-ingestion"
version = "0.1.0"
description = "CloudRobo local data ingestion daemon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Huawei Cloud CloudRobo Team", email = "hwcloudrobo@huawei.com"}]
classifiers = ["Operating System :: OS Independent", "Programming Language :: Python :: 3"]
dependencies = ["hw-cloudrobo-core>=0.1.0", "hw-cloudrobo-r2c[client]>=0.1.0"]

[project.optional-dependencies]
lerobot-validation = ["pyarrow>=14", "av>=11"]

[project.entry-points."cloudrobo.groups"]
ingestion = "cloudrobo_ingestion.cli:ingestion"

[tool.setuptools.packages.find]
where = ["src"]
